name: Checks
on: [push]
permissions:
  contents: read
jobs:
  just-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Fetch CI dependencies
        run: |
          nix develop .#
      - name: Execute `gradle jar`
        run: |
          nix develop .# --command sh -c "gradle jar renameJarToSrg"
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: "error"
          name: "Developer JAR"
          path: build/libs/*-dev.jar
      - run: |
          rm build/libs/*-dev.jar
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: "error"
          name: "Regular JAR (this is probably what you want)"
          path: build/libs/*.jar



